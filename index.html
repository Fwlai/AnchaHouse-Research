<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no,viewport-fit=cover">
<meta name="theme-color" content="#07172b">
<title>Ancha House</title>
<script type="importmap">{"imports":{"three":"https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js","three/addons/":"https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/"}}</script>
<style>
:root{color-scheme:dark}*{box-sizing:border-box}html,body{margin:0;width:100%;height:100%;overflow:hidden;background:#07172b;font-family:Georgia,serif}body{touch-action:none}#stage{position:fixed;inset:0;overflow:hidden}canvas{display:block;width:100%;height:100%;touch-action:none}#menu{position:fixed;inset:0;pointer-events:none;display:flex;justify-content:flex-end;align-items:center;padding:clamp(16px,4vw,58px)}#slots{display:flex;flex-direction:column;gap:clamp(9px,1.7vh,18px);width:clamp(58px,8vw,102px);pointer-events:auto}.slot{height:clamp(48px,9vh,82px);border:1px solid #d7c48a66;border-radius:5px;background:linear-gradient(145deg,#16233c9c,#080f21b8);box-shadow:0 7px 18px #02061155,inset 0 1px #fff2;backdrop-filter:blur(3px);transform:translateZ(0);transition:transform .2s ease,border-color .2s ease}.slot:nth-child(2),.slot:nth-child(4){transform:translateX(-5px)}.slot:active{transform:scale(.97)}#brand{position:fixed;left:clamp(16px,3vw,42px);bottom:clamp(14px,3vh,32px);color:#fff0d2aa;font-size:clamp(10px,1.1vw,14px);letter-spacing:.28em;text-transform:uppercase;pointer-events:none;text-shadow:0 2px 9px #000}#landscape{display:none;position:fixed;z-index:20;inset:0;background:linear-gradient(#101c37,#07111e);color:#eee6d1;align-items:center;justify-content:center;text-align:center;padding:28px;font:16px/1.6 system-ui,sans-serif}#landscape .inner{max-width:320px}#landscape .phone{font-size:52px;display:block;margin-bottom:18px;animation:turn 2.5s ease-in-out infinite alternate}@keyframes turn{to{transform:rotate(90deg)}}@media(orientation:portrait){#landscape{display:flex}#stage,#menu,#brand{visibility:hidden}}#error{display:none;position:fixed;left:12px;bottom:12px;color:#fff;background:#721f2c;padding:8px;font:12px system-ui;max-width:80vw}
</style>
</head>
<body>
<div id="stage"></div>
<div id="menu" aria-label="Main menu"><div id="slots"><button class="slot" aria-label="Menu slot 1"></button><button class="slot" aria-label="Menu slot 2"></button><button class="slot" aria-label="Menu slot 3"></button><button class="slot" aria-label="Menu slot 4"></button><button class="slot" aria-label="Menu slot 5"></button></div></div>
<div id="brand">ANCHA HOUSE</div>
<div id="landscape"><div class="inner"><span class="phone">▯</span><strong>Rotate your device</strong><br>This experience is designed for landscape mode.</div></div>
<div id="error"></div>
<script type="module">
import * as THREE from 'three';
import {GLTFLoader} from 'three/addons/loaders/GLTFLoader.js';
const host=document.querySelector('#stage'),error=document.querySelector('#error');
const scene=new THREE.Scene();scene.background=new THREE.Color('#10172f');scene.fog=new THREE.Fog('#10172f',38,100);
const camera=new THREE.PerspectiveCamera(34,innerWidth/innerHeight,.1,180);camera.position.set(0,8.4,27);
const renderer=new THREE.WebGLRenderer({antialias:false,alpha:false,powerPreference:'high-performance'});renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));renderer.setSize(innerWidth,innerHeight);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.16;host.appendChild(renderer.domElement);
scene.add(new THREE.HemisphereLight(0xd9e9ff,0x536049,2.1));
const key=new THREE.DirectionalLight(0xffe7bf,3.3);key.position.set(-8,15,9);scene.add(key);
const fill=new THREE.DirectionalLight(0xa9caff,1.7);fill.position.set(8,9,-10);scene.add(fill);
const world=new THREE.Group();scene.add(world);const island=new THREE.Group();world.add(island);
const mat=(color,roughness=1)=>new THREE.MeshStandardMaterial({color,roughness,flatShading:true});
const grass=mat('#477c48'),grass2=mat('#5d914c'),sand=mat('#c9ad75'),sandLight=mat('#e0c68c'),stone=mat('#777d80'),stone2=mat('#92958b'),waterMats=['#164c78','#1a5b83','#21678b','#2b7192'].map(c=>new THREE.MeshStandardMaterial({color:c,roughness:.82,flatShading:true}));
const plane=(w,h,m,x,y,z,group=island)=>{const o=new THREE.Mesh(new THREE.BoxGeometry(w,.22,h),m);o.position.set(x,y,z);group.add(o);return o};
const ocean=new THREE.Group();scene.add(ocean);
for(let i=0;i<15;i++){for(let j=0;j<10;j++){const x=(i-7)*5.2,z=(j-5)*5.2;const tile=plane(5.1,5.1,waterMats[(i*7+j*3)%4],x,-2.35,z,ocean);tile.userData.baseY=-2.35;tile.userData.phase=(i*17+j*13)%100;}}
const coast=new THREE.Group();island.add(coast);
const groundBase=new THREE.Mesh(new THREE.BoxGeometry(28,1.5,21),sand);groundBase.position.set(0,-1.45,0);island.add(groundBase);
plane(26.5,19.5,grass,0,-.62,0);
for(let i=0;i<340;i++){const x=(Math.random()-.5)*25.8,z=(Math.random()-.5)*18.8;const patch=new THREE.Mesh(new THREE.BoxGeometry(.13+Math.random()*.22,.025,.13+Math.random()*.22),Math.random()>.6?grass2:mat('#3e7041'));patch.position.set(x,-.48+Math.random()*.025,z);island.add(patch);}
const paving=new THREE.Group();island.add(paving);
function tileFloor(w,h,cols,rows,x0,z0,sizeX,sizeZ){for(let z=0;z<rows;z++)for(let x=0;x<cols;x++){const m=Math.random()>.58?stone2:stone;const t=new THREE.Mesh(new THREE.BoxGeometry(sizeX-.055,.09,sizeZ-.055),m);t.position.set(x0+x*sizeX,-.39,z0+z*sizeZ);paving.add(t);if(Math.random()>.82){const seam=new THREE.Mesh(new THREE.BoxGeometry(sizeX*.12,.012,sizeZ*.12),mat('#62696b'));seam.position.set(t.position.x,-.33,t.position.z);paving.add(seam);}}}
tileFloor(1,1,8,6,-3.5,-3,1,1);tileFloor(1,1,5,2,-2,-4.1,1,1);
const shore=new THREE.Group();island.add(shore);
for(let i=0;i<100;i++){let x,z;if(i<50){x=(Math.random()-.5)*27;z=(Math.random()>.5?1:-1)*(9.55+Math.random()*.42)}else{z=(Math.random()-.5)*19.5;x=(Math.random()>.5?1:-1)*(13.25+Math.random()*.35)}const peb=new THREE.Mesh(new THREE.BoxGeometry(.15+Math.random()*.35,.025,.12+Math.random()*.2),Math.random()>.5?sandLight:sand);peb.position.set(x,-.61,z);island.add(peb);}
const castleRoot=new THREE.Group();island.add(castleRoot);let castle=null;
new GLTFLoader().load('./assets/castle_3d_model.glb',g=>{castle=g.scene;castleRoot.add(castle);const box=new THREE.Box3().setFromObject(castle);const center=box.getCenter(new THREE.Vector3()),size=box.getSize(new THREE.Vector3());castle.position.sub(center);castle.position.y+=Math.max(.4,-box.min.y+center.y);const max=Math.max(size.x,size.y,size.z);castle.scale.setScalar(13.8/max);castle.position.y-=.15;},undefined,e=>{error.style.display='block';error.textContent='Castle model failed to load. Check assets/castle_3d_model.glb and hosting.';});
castleRoot.position.set(-.5,-.15,-.2);
const skyDome=new THREE.Mesh(new THREE.SphereGeometry(100,16,10),new THREE.MeshBasicMaterial({color:'#111c3b',side:THREE.BackSide,depthWrite:false}));scene.add(skyDome);
// Blocky voxel clouds: intentionally cube-built, no spherical shapes and no cast shadows.
const clouds=[];
for(let c=0;c<13;c++){const group=new THREE.Group();const count=7+(c%5);for(let k=0;k<count;k++){const w=.7+(k%3)*.22,h=.25+(k%2)*.16,d=.45+(k%2)*.18;const mesh=new THREE.Mesh(new THREE.BoxGeometry(w,h,d),new THREE.MeshStandardMaterial({color:k%3===0?'#e2e4f0':'#c7d4e8',roughness:1,flatShading:true,transparent:true,opacity:.72}));mesh.position.set((k-(count-1)/2)*.53,(k%3)*.14,Math.sin(k*2)*.14);group.add(mesh);}group.position.set((c-6)*8,13+(c%4)*1.6,-35-(c%3)*8);group.userData={x:group.position.x,phase:c*1.7,speed:.08+(c%4)*.012};scene.add(group);clouds.push(group);}
// A tiny pixel-art witch sprite made from hard-edged pixels; two copies follow independent castle-relative orbits.
function makeWitchTexture(palette){const c=document.createElement('canvas');c.width=24;c.height=32;const x=c.getContext('2d');x.imageSmoothingEnabled=false;const pix=(a,b,w,h,col)=>{x.fillStyle=col;x.fillRect(a,b,w,h)};pix(7,22,12,2,palette.broom);pix(12,19,2,4,palette.broom);pix(9,15,7,7,palette.cloak);pix(10,10,5,6,palette.skin);pix(8,8,9,3,palette.hat);pix(11,5,5,4,palette.hat);pix(7,11,3,2,palette.hat);pix(10,12,1,1,'#201c2a');pix(14,12,1,1,'#201c2a');pix(8,17,2,5,palette.cloak);pix(15,17,2,5,palette.cloak);pix(6,24,13,1,palette.broom);pix(5,23,2,2,palette.broom);return new THREE.CanvasTexture(c);}
const witchTex=[makeWitchTexture({hat:'#27253f',cloak:'#454b87',skin:'#e3c3aa',broom:'#78513d'}),makeWitchTexture({hat:'#211d30',cloak:'#633b75',skin:'#edc8a7',broom:'#72503a'})];witchTex.forEach(t=>{t.magFilter=THREE.NearestFilter;t.minFilter=THREE.NearestFilter;t.colorSpace=THREE.SRGBColorSpace;});
const witches=[];for(let i=0;i<2;i++){const sprite=new THREE.Sprite(new THREE.SpriteMaterial({map:witchTex[i],transparent:true,depthWrite:false,alphaTest:.1}));sprite.scale.set(1.45,1.95,1);scene.add(sprite);witches.push(sprite);}
let yaw=0,pitch=0,targetYaw=0,targetPitch=0,dragging=false,pointerX=0,pointerY=0,downX=0,downY=0,dayBlend=0;
renderer.domElement.addEventListener('pointerdown',e=>{dragging=true;pointerX=e.clientX;pointerY=e.clientY;downX=e.clientX;downY=e.clientY;renderer.domElement.setPointerCapture(e.pointerId);});
renderer.domElement.addEventListener('pointermove',e=>{if(!dragging)return;const dx=e.clientX-pointerX,dy=e.clientY-pointerY;pointerX=e.clientX;pointerY=e.clientY;targetYaw=THREE.MathUtils.clamp(targetYaw+dx*.006,-.72,.72);targetPitch=THREE.MathUtils.clamp(targetPitch+dy*.003,-.18,.24);});
const endDrag=()=>{dragging=false;};renderer.domElement.addEventListener('pointerup',endDrag);renderer.domElement.addEventListener('pointercancel',endDrag);
const clock=new THREE.Clock();const lookTarget=new THREE.Vector3(0,2.5,0);
function render(){requestAnimationFrame(render);const dt=Math.min(clock.getDelta(),.04),t=clock.elapsedTime;
// One full day/night cycle takes 12 minutes, with long twilight transitions.
const phase=(t/720*Math.PI*2-Math.PI/2);dayBlend=(Math.sin(phase)+1)/2;
const night=new THREE.Color('#111a39'),dawn=new THREE.Color('#d28d83'),day=new THREE.Color('#77b5df'),dusk=new THREE.Color('#df8b72');let skyColor;
if(dayBlend<.25)skyColor=night.clone().lerp(dawn,dayBlend/.25);else if(dayBlend<.72)skyColor=dawn.clone().lerp(day,(dayBlend-.25)/.47);else skyColor=day.clone().lerp(dusk,Math.min(1,(dayBlend-.72)/.28));
scene.background.copy(skyColor);skyDome.material.color.copy(skyColor);scene.fog.color.copy(skyColor);
key.color.copy(new THREE.Color('#a7c7ff').lerp(new THREE.Color('#fff0cf'),dayBlend));key.intensity=.45+2.85*dayBlend;fill.intensity=1.25;scene.children.find(o=>o.isHemisphereLight).intensity=.65+1.6*dayBlend;
const starsVisible=1-dayBlend; // sparse tiny square stars fade away in daylight
castleRoot.rotation.y=dragging?targetYaw:THREE.MathUtils.damp(castleRoot.rotation.y,targetYaw+Math.sin(t*.22)*.012,.7,dt);
castleRoot.rotation.x=dragging?targetPitch:THREE.MathUtils.damp(castleRoot.rotation.x,targetPitch,.8,dt);
if(!dragging){targetYaw=THREE.MathUtils.damp(targetYaw,0,.5,dt);targetPitch=THREE.MathUtils.damp(targetPitch,0,.65,dt);}
island.rotation.y=castleRoot.rotation.y*.10;island.rotation.x=castleRoot.rotation.x*.1;
camera.position.x=THREE.MathUtils.damp(camera.position.x,Math.sin(castleRoot.rotation.y)*1.15,.9,dt);camera.position.y=8.4+castleRoot.rotation.x*5;camera.lookAt(lookTarget);
clouds.forEach(c=>{c.position.x=c.userData.x+Math.sin(t*c.userData.speed+c.userData.phase)*1.1;c.position.y+=Math.sin(t*.15+c.userData.phase)*.0008;});
ocean.children.forEach(tile=>{tile.position.y=tile.userData.baseY+Math.sin(t*.7+tile.userData.phase)*.035;});
const nightFactor=THREE.MathUtils.smoothstep(1-dayBlend,.32,.78);witches.forEach((w,i)=>{const a=t*(i===0?.24:-.19)+i*Math.PI;const radius=i===0?7.3:9.1;const x=Math.cos(a)*radius-.5,z=Math.sin(a)*radius-1.5,y=4.5+Math.sin(a*2+i)*1.1;w.position.set(x,y,z);w.material.opacity=nightFactor;w.visible=nightFactor>.015;w.material.rotation=-Math.sin(a)*.13;});
renderer.render(scene,camera);}
function resize(){camera.aspect=innerWidth/innerHeight;camera.updateProjectionMatrix();renderer.setSize(innerWidth,innerHeight);renderer.setPixelRatio(Math.min(devicePixelRatio,1.7));}
addEventListener('resize',resize);render();
</script>
</body>
</html>
