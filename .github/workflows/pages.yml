name: Deploy Ancha House to GitHub Pages

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  validate:
    name: Validate menu and required assets
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Validate required files and menu structure
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          test -s assets/castle_3d_model.glb
          test -s assets/sprites/witch-on-broomstick/PNG/48x64_scale2x/witch-001-NESW.png
          test -s assets/sprites/witch-on-broomstick/PNG/48x64_scale2x/witch-002-NESW.png
          python3 - <<'PY'
          from pathlib import Path
          import re, struct
          html = Path("index.html").read_text()
          assert html.count('class="slot"') == 5, "Expected exactly five blank menu slots"
          assert "castle_3d_model.glb" in html, "Castle model path missing"
          assert "witch-001-NESW.png" in html and "witch-002-NESW.png" in html, "Original witch sprite paths missing"
          assert "Rotate your device" in html, "Landscape-only prompt missing"
          assert "1-(row+1)/4" in html, "Sprite-sheet frame selection missing"
          glb = Path("assets/castle_3d_model.glb").read_bytes()[:12]
          assert glb[:4] == b"glTF", "Castle file is not a GLB"
          assert struct.unpack("<I", glb[4:8])[0] == 2, "Castle GLB is not glTF 2.0"
          for name in ("witch-001-NESW.png", "witch-002-NESW.png"):
              p = Path("assets/sprites/witch-on-broomstick/PNG/48x64_scale2x") / name
              data = p.read_bytes()
              assert data[:8] == b"\x89PNG\r\n\x1a\n", f"{name} is not PNG"
              width, height = struct.unpack(">II", data[16:24])
              assert width % 3 == 0 and height % 4 == 0, f"{name} is not a 3x4 sprite sheet"
              print(f"OK: {name} ({width}x{height}, 3x4 frames)")
          scripts = re.findall(r'<script type="module">([\s\S]*?)</script>', html)
          assert scripts, "Module script not found"
          Path("/tmp/ancha-menu.mjs").write_text(scripts[-1])
          print("OK: menu structure, model header, and sprite sheets")
          PY

      - name: Check JavaScript syntax
        run: node --check /tmp/ancha-menu.mjs

  deploy:
    needs: validate
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - name: Check out repository
        uses: actions/checkout@v4
      - name: Configure Pages
        uses: actions/configure-pages@v5
      - name: Upload site
        uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - name: Deploy
        id: deployment
        uses: actions/deploy-pages@v4
